<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keeper Planner</title>
<meta name="description" content="Training calendar and workout tracker for a goalkeeper's week.">
<meta name="theme-color" content="#0B0B0C">
<script>
  // Paint the saved theme before anything loads, so there's no flash of the wrong one.
  try {
    var look = JSON.parse(localStorage.getItem('kp:look') || '{}');
    var t = look.theme || 'industrial';
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'blackboard' : 'whiteboard';
    if (t === 'light') t = 'whiteboard';
    if (t === 'dark') t = 'blackboard';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'industrial'; }
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app"><div class="boot">Loading Keeper Planner…</div></div>
<noscript>Keeper Planner needs JavaScript turned on.</noscript>
</body>
</html>
